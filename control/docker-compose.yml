services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - skdata:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SK_DOMAIN=${SK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
volumes:
  skdata:
  caddydata:
